name: Release
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release create-video-editor
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing: no token, the registry trusts this workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@25 -p @semantic-release/git@10 semantic-release
